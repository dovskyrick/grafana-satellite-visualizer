version: '3.8'

services:
  mockup-twin:
    build:
      context: ../mockup-digital-twin
    container_name: mockup-twin
    ports:
      - "3001:3001"
    volumes:
      - ../mockup-digital-twin/src:/app/src
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    labels:
      - "com.grafana.url=http://localhost:3000"
    environment:
      # Allow unsigned plugins (required for development)
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=3d-orbit-attitude-plugin
      # Enable development mode
      - GF_DEFAULT_APP_MODE=development
      # Disable plugin signature validation
      - GF_PLUGINS_ENABLE_ALPHA=true
      # Optional: Set admin credentials
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Enable logging for debugging
      - GF_LOG_LEVEL=debug
      # Digital twin URL for datasource provisioning
      - DIGITAL_TWIN_URL=http://mockup-twin:3001
    volumes:
      # Mount 3d-orbit-attitude-plugin (built output)
      - ../grafana-plugins/3d-orbit-attitude-plugin/dist:/var/lib/grafana/plugins/3d-orbit-attitude-plugin
      # Mount provisioning for auto-configuration
      - ./provisioning:/etc/grafana/provisioning
      # Persist Grafana data
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage:

